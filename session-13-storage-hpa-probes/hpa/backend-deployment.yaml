# The workload that `hpa-backend.yaml` targets and `load_generator.sh` hammers.
# A tiny HTTP server on port 5000 exposing /healthz. Each request does a small
# amount of real CPU work so that sustained traffic actually moves the CPU
# utilisation figure the HPA scales on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          ports:
            - containerPort: 5000
          command: ["python3", "-c"]
          args:
            - |
              import hashlib
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      # burn a measurable slice of CPU per request
                      h = b"seed"
                      for _ in range(12000):
                          h = hashlib.sha256(h).digest()
                      body = b"ok" if self.path == "/healthz" else b"yatri-backend"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *a):
                      pass

              print("yatri-backend listening on :5000", flush=True)
              HTTPServer(("", 5000), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
