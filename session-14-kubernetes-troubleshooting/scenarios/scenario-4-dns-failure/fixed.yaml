# FIX: the client resolved "postgres-db-wrong-name.production.svc.cluster.local"
# -- both the Service name and the namespace were wrong, and no such Service
# existed. This manifest creates the backend it is supposed to talk to and
# points the client at the correct FQDN: <service>.<namespace>.svc.cluster.local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: stub
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal database...";
          curl -s --connect-timeout 3 http://postgres-db.default.svc.cluster.local:5432 \
            && echo "[OK] Resolved and connected to postgres-db" ;
          echo "Process sleeping...";
          sleep 3600
