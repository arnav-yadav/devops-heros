# FIX: the container read DATABASE_URL but no env block supplied it, so the
# script hit sys.exit(1) on every start -> CrashLoopBackOff.
# Providing the variable lets the application start and stay Running.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgresql://app:secret@postgres-db.default.svc.cluster.local:5432/appdb"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          print("Connected to:", db_url)
          while True:
              time.sleep(30)
